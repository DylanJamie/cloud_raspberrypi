<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Server_Cloud — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/create_account.css">
  </head>

  <body>
    <div class="sky">
      <div class="sun"></div>
      <div class="drift drift--a"></div>
      <div class="drift drift--b"></div>
      <div class="drift drift--c"></div>
    </div>

    <main class="stage">

      <div class="wordmark">
        <span class="wordmark__glyph">☁</span>
        <span class="wordmark__text">Server<span class="wordmark__underscore">_</span>Cloud</span>
      </div>

      <div class="cloud-shadow">
        <div class="cloud">
	  <form class="cloud__form" id="forgotPassForm" action="">
	    <h1>Forgot Password</h1>	    
	    <label class="field">
	      <span class="field__label">New Password</span>
	      <input type="password" id="password" name="password" placeholder="******" autocomplete="current-password" required>
            </label>

	     <label class="field">
	      <span class="field__label">Confirm Password</span>
	      <input type="password" id="confirm_password" name="confirm_password" placeholder="******" autocomplete="confirm-password" required>
             </label>

	     <div class="button-row">
	       <a class="btn btn--ghost" href="/login">Back</a>
	       <button type="submit" class="btn" id="confirmBtn">Confirm</button>
	     </div>
	       
	    </form>

	</div>
      </div>
      
    </main>      
  </body>
</html>

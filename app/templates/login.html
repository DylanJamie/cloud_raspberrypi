<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Server_Cloud — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
  </head>

  <body>

    <div class="sky">
      <div class="sun"></div>
      <div class="drift drift--a"></div>
      <div class="drift drift--b"></div>
      <div class="drift drift--c"></div>
    </div>

    <main class="stage">

      <div class="wordmark">
        <span class="wordmark__glyph">☁</span>
        <span class="wordmark__text">Server<span class="wordmark__underscore">_</span>Cloud</span>
      </div>

      <div class="cloud-shadow">
        <div class="cloud">
          <div class="cloud__puff cloud__puff--1"></div>
          <div class="cloud__puff cloud__puff--2"></div>
          <div class="cloud__puff cloud__puff--3"></div>
          <div class="cloud__puff cloud__puff--4"></div>
          <div class="cloud__puff cloud__puff--5"></div>

          <form class="cloud__form" action="">
            <p class="eyebrow">All Files ONE Place.</p>
            <h1>Welcome back</h1>

            <label class="field">
              <span class="field__label">Username</span>
              <input type="text" id="username" name="username" placeholder="Name" autocomplete="username" required>
            </label>

            <label class="field">
              <span class="field__label">Password</span>
              <input type="password" id="password" name="password" placeholder="******" autocomplete="current-password" required>
            </label>

            <div class="row">
              <label class="remember">
                <input type="checkbox">
                <span>Keep me signed in</span>
              </label>
              <a class="link" href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Sign in</button>

            <p class="switch">New here? <a class="link" href="#">Create an account</a></p>
          </form>
        </div>
      </div>

      <p class="footnote">Hosted on a Raspberry Pi in Dylan's living room.</p>

    </main>
    <script src="/static/js/login.js"></script>
  </body>
</html>

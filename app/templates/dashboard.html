<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Server_Cloud — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
  </head>

  <body>

    <div class="sky"></div>

    <header class="topbar">
      <div class="wordmark">
        <span class="wordmark__glyph">☁</span>
        <span class="wordmark__text">Server<span class="wordmark__underscore">_</span>Cloud</span>
      </div>
      <button class="btn btn--ghost" id="logoutBtn">Log out</button>
    </header>

    <main class="content">

      <section class="panel">
        <h2>Upload a file</h2>
        <form id="uploadForm" class="upload-form">
          <input type="file" id="fileInput" name="file" required>
          <button type="submit" class="btn">Upload</button>
        </form>
        <p id="uploadStatus" class="status-text"></p>
      </section>

      <section class="panel">
        <h2>Your files</h2>
        <div id="fileList" class="file-list">
          <p class="empty-state">Loading your files…</p>
        </div>
      </section>

    </main>

    <script src="/static/js/dashboard.js"></script>
  </body>
</html>
